<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">NexTerm</title>
  <desc id="desc">A futuristic terminal window with a connected circuit path.</desc>
  <defs>
