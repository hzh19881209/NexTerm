services:
  termhub:
    build: .
    container_name: termhub
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${LAN_BIND_IP:-192.168.X.X}:${HOST_PORT:-3010}:3000"
    volumes:
      - termhub_data:/app/data
      - ./certs:/app/certs:ro
    environment:
      DEPLOYMENT_SERVER_NAME: ${DEPLOYMENT_SERVER_NAME:-${HOSTNAME:-termhub}}
      PUBLIC_HOST: ${PUBLIC_HOST:-your.domain.com}
      PUBLIC_URL: ${PUBLIC_URL:-https://your.domain.com}
      TLS_CERT_FILE: /app/certs/your.domain.com.crt
      TLS_KEY_FILE: /app/certs/your.domain.com.key
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The bind-mounted key is root:root 0640; this lets the non-root node
    # process read it without running the application as root.
    group_add:
      - "0"
    init: true

volumes:
  termhub_data:
